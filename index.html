<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#185a9d" />
    <meta name="description" content="Excel 按列拆分工具，浏览器本地处理，按 A 列值导出多个 xlsx 文件。" />
    <title>Excel 按列拆分工具</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
  <style>
:root { color-scheme:light; --accent:#0066cc; --ink:#1d1d1f; --line:#dedee3; --surface:#f5f5f7 }
body.suite { display:block; margin:0; padding:0; color:var(--ink); background:var(--surface); font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif }
.suite * { box-sizing:border-box }
.suite .tool-nav { background:#fff; color:var(--ink); border-bottom:1px solid var(--line); padding:0; margin:0 }
.suite .tool-nav nav { display:flex; flex-wrap:wrap; align-items:center; gap:6px 28px; max-width:1100px; margin:auto; padding:12px 22px; background:none; border:0 }
.suite .tool-nav nav div { display:flex; flex-wrap:wrap; gap:4px 18px }
.suite .tool-nav a { display:inline-block; background:none; color:var(--ink); padding:4px 0; text-decoration:none; white-space:nowrap; font-size:14px }
.suite .tool-nav a.brand { font-size:19px; font-weight:700 }
.suite .tool-nav a:hover,.suite .tool-nav a[aria-current] { color:var(--accent) }
.suite .suite-main,.suite .shell { width:min(100%,1050px); margin:auto; padding:24px 22px }
.suite .suite-panel,.suite .hero,.suite .upload-panel,.suite .summary-panel,.suite .log-panel,.suite .related-panel { background:white; border:1px solid var(--line); border-radius:8px; box-shadow:none }
.suite .suite-panel { padding:22px; margin:0 0 16px }
.suite h1,.suite h2 { color:var(--ink); text-align:left; letter-spacing:0; padding:0; border:0 }
.suite h1 { font-size:28px; line-height:1.2; margin:0 0 16px }
.suite h2 { font-size:21px; margin:0 0 12px }
.suite input,.suite select,.suite textarea,.suite button { font:inherit; max-width:100%; accent-color:var(--accent) }
.suite button,.suite #downloadImg { background:var(--accent); color:white; border:0; border-radius:8px; padding:8px 15px; box-shadow:none; cursor:pointer }
.suite button:hover:not(:disabled),.suite #downloadImg:hover { background:#0054a9 }
.suite button:disabled { opacity:.55; cursor:default }
.suite :focus-visible { outline:2px solid var(--accent); outline-offset:3px }
.suite #output,.suite #result { background:var(--surface); color:var(--ink); border-radius:8px; box-shadow:none; overflow-wrap:anywhere }
.suite #output:empty,.suite #result:empty { display:none }
.suite .hero-panel,.suite .drop-zone,.suite .stats div { background:var(--surface); color:var(--ink); box-shadow:none }
.suite .hero-panel p,.suite .subtitle,.suite .hero-panel strong { color:var(--ink) }
.suite .hero-panel > span,.suite .hero .eyebrow { display:none }
.suite canvas { height:auto; max-width:100% }
.suite .container.suite-panel { max-width:none; width:auto; margin:0; transform:none }
.suite .container > label { display:flex; gap:8px; align-items:center; margin:10px 0; background:none; box-shadow:none }
.suite #length { width:100%; appearance:auto }
@media(max-width:650px) {
  .suite .tool-nav nav { padding:9px 14px; gap:3px 14px }
  .suite .suite-main,.suite .shell { padding:14px }
  .suite .suite-panel { padding:16px }
  .suite h1 { font-size:23px }
}

.suite .shell { display:block }
.suite .workspace { display:grid; grid-template-columns:minmax(0, 1.45fr) minmax(0, 1fr); gap:16px; align-items:start; margin:0 0 16px }
.suite .upload-panel,.suite .summary-panel,.suite .log-panel { min-width:0; padding:22px }
.suite .drop-zone { min-height:112px; padding:14px; border:1px dashed #a9b5c4; color:var(--ink) }
.suite .drop-zone:hover,.suite .drop-zone:focus-within { border-color:var(--accent); background:#edf5ff }
.suite .upload-icon { width:auto; height:auto; padding:2px 8px; border-radius:6px; color:var(--accent); background:#e5effb; box-shadow:none }
.suite .ghost-button,.suite .text-button { background:#edf5ff; color:var(--accent) }
.suite .ghost-button:hover,.suite .text-button:hover { color:white }
.suite .split-status { margin-top:14px; padding-top:12px; border-top:1px solid var(--line); font-size:14px }
.suite .split-status p { margin:3px 0 0; color:#565961 }
.suite .stats,.suite .group-list,.suite #logOutput { overflow-wrap:anywhere }
.suite #logOutput { white-space:pre-wrap; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:8px }
@media(max-width:760px) {
  .suite .workspace { grid-template-columns:minmax(0,1fr) }
  .suite .upload-panel,.suite .summary-panel,.suite .log-panel { padding:16px }
}
@media(max-width:420px) {
  .suite .options-grid { grid-template-columns:minmax(0,1fr) }
}
</style>
</head>
  <body class="suite"><header class="tool-nav"><nav aria-label="工具导航"><a class="brand" href="https://baicaige.github.io/format-tool/">白菜的小工具</a><div><a href="https://baicaige.github.io/format-tool/#openid">OpenID 拆分</a><a href="https://baicaige.github.io/excel-splitter/" aria-current="page">Excel 拆分</a><a href="https://baicaige.github.io/format-tool/zhengjianzhao.html">证件照排版</a><a href="https://baicaige.github.io/format-tool/mima.html">随机密码</a></div></nav></header>
    <main class="shell">
      

<section class="workspace">
        <div class="upload-panel" aria-labelledby="page-title">
          <h1 id="page-title">Excel 拆分</h1>
          <label class="drop-zone" id="dropZone">
            <input id="fileInput" type="file" accept=".xlsx,.xls,.csv" />
            <span class="upload-icon" aria-hidden="true">XLS</span>
            <strong>拖入 Excel 文件，或点击选择</strong>
            <small id="fileHint">支持 XLSX、XLS、CSV · 读取第一个工作表</small>
          </label>

          <div class="options-grid" aria-label="拆分设置">
            <label>
              <span>拆分列</span>
              <input id="columnInput" type="text" value="A" maxlength="3" autocomplete="off" />
            </label>
            <label>
              <span>空值名称</span>
              <input id="emptyNameInput" type="text" value="未填写" autocomplete="off" />
            </label>
            <label class="check-row">
              <input id="headerCheckbox" type="checkbox" checked />
              <span>首行是标题行</span>
            </label>
            <label class="check-row">
              <input id="trimCheckbox" type="checkbox" checked />
              <span>去掉首尾空格后分组</span>
            </label>
          </div>

          <div class="actions">
            <button class="primary-button" id="splitButton" type="button" disabled>生成拆分文件</button>
            <button class="ghost-button" id="resetButton" type="button">清空</button>
          </div>
          <div class="split-status" role="status"><strong id="statusTitle">等待选择文件</strong><p id="statusText">文件在浏览器本地处理。</p></div>
        </div>

        <aside class="summary-panel" aria-labelledby="summary-title">
          <div class="panel-heading">

            <h2 id="summary-title">分组结果</h2>
          </div>
          <dl class="stats">
            <div><dt>数据行</dt><dd id="rowCount">0</dd></div>
            <div><dt>分组数</dt><dd id="groupCount">0</dd></div>
            <div><dt>工作表</dt><dd id="sheetName">-</dd></div>
          </dl>
          <div class="group-list" id="groupList">选择文件后显示每个输出文件名。</div>
        </aside>
      </section>

      <section class="log-panel" aria-live="polite">
        <div class="panel-heading inline">
          <div>

            <h2>运行状态</h2>
          </div>
          <button class="text-button" id="copyLogButton" type="button">复制记录</button>
        </div>
        <pre id="logOutput">尚未开始。</pre>
      </section>

    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./vendor/xlsx.full.min.js"></script>
    <script src="./vendor/jszip.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
